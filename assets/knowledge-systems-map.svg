<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Systems Map</title>
  <desc id="desc">A visual map connecting knowledge, graph, retrieval, reasoning and decisions through feedback loops.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a66c2"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label-light { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small-light { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .micro { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .06em; }
      .line { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 6 7; marker-end: url(#arrow); }
      .node { filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1180" height="500" rx="28" fill="url(#surface)"/>
  <rect x="26" y="26" width="1128" height="448" rx="24" fill="#ffffff" opacity="0.78"/>

  <text x="72" y="76" class="micro">AI &amp; KNOWLEDGE SYSTEMS</text>
  <text x="72" y="112" class="label">From scattered context to traceable decisions</text>
  <text x="72" y="140" class="small">A working loop for architecture, discovery, retrieval and system understanding.</text>

  <path class="line" d="M 238 328 C 278 304, 316 304, 356 328"/>
  <path class="line" d="M 552 328 C 586 304, 614 304, 648 328"/>
  <path class="line" d="M 842 328 C 872 304, 892 304, 922 328"/>
  <path class="soft-line" d="M 996 384 C 790 446, 418 446, 176 382"/>
  <path class="soft-line" d="M 590 278 C 590 254, 590 248, 590 238"/>

  <g class="node">
    <rect x="74" y="278" width="166" height="112" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="74" y="278" width="166" height="8" rx="4" fill="url(#blue)"/>
    <text x="102" y="326" class="label">Knowledge</text>
    <text x="102" y="354" class="small">documents, code,</text>
    <text x="102" y="374" class="small">people, decisions</text>
  </g>

  <g class="node">
    <rect x="356" y="278" width="198" height="112" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="356" y="278" width="198" height="8" rx="4" fill="url(#violet)"/>
    <text x="400" y="326" class="label">Graph</text>
    <text x="392" y="354" class="small">entities, relations,</text>
    <text x="392" y="374" class="small">meaningful context</text>
  </g>

  <g class="node">
    <rect x="648" y="278" width="196" height="112" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="648" y="278" width="196" height="8" rx="4" fill="url(#green)"/>
    <text x="688" y="326" class="label">Retrieval</text>
    <text x="686" y="354" class="small">evidence, ranking,</text>
    <text x="686" y="374" class="small">grounded answers</text>
  </g>

  <g class="node">
    <rect x="922" y="278" width="188" height="112" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="922" y="278" width="188" height="8" rx="4" fill="#f59e0b"/>
    <text x="960" y="326" class="label">Decision</text>
    <text x="960" y="354" class="small">options, trade-offs,</text>
    <text x="960" y="374" class="small">traceable outcomes</text>
  </g>

  <g class="node">
    <rect x="488" y="156" width="204" height="82" rx="18" fill="#0f172a"/>
    <text x="535" y="193" class="label-light">Reasoning</text>
    <text x="527" y="218" class="small-light">agents, models, critique</text>
  </g>

  <text x="264" y="302" class="micro">STRUCTURE</text>
  <text x="570" y="302" class="micro">SELECT</text>
  <text x="860" y="302" class="micro">APPLY</text>
  <text x="514" y="470" class="micro">FEEDBACK: LEARN, MAP, REFINE</text>
</svg>
